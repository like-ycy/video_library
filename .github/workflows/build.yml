name: 构建产物

# 为什么 Windows 侧必须放在 Windows runner 上
# ---------------------------------
# PyInstaller 不是交叉编译器。官方文档（doc/building-for-other-platforms.rst）：
#
#   "PyInstaller is not a cross compiler. Due to Python's dynamic nature,
#    PyInstaller needs to run snippets of code from the target Python environment
#    at build time and it can only do that if said environment is runable on
#    (i.e. built for) the current platform. Hence, PyInstaller ever becoming
#    a cross compiler is impossible."
#
# 也就是说：它需要在构建时**真的执行目标平台的 Python** 来探测依赖，而 macOS
# 上跑不了 Windows 的 Python。这不是版本问题，没有绕过的余地。
#
# 所以 Windows 的 scraper.exe 必须在 Windows runner 上打包；macOS 的 scraper
# 必须在对应架构的 macOS runner 上打包。Go / Wails 侧是静态编译，可以按
# GOOS/GOARCH 交叉编译，但为了让两侧产物来自同一次构建、架构一致，CI 仍按
# 目标平台分别在原生 runner 上完成整包。
#
# 产物形态
# --------
# 每个平台 job 产出四类文件：
#
# 1. App 包（轻量，默认下载项）：`VideoLib_<ver>_<os>_<arch>.zip` / `.tar.gz`
#       VideoLib(.app) 本体，不含刮削器。首次刮削时 App 自己下载组件。
# 2. App 整包（离线用）：`VideoLib_<ver>_full_<os>_<arch>.zip` / `.tar.gz`
#       同上 + tools/scraper 随包分发。给拿不到 GitHub 直连、或要拷到无网机器的人。
# 3. 组件包与自述：`scraper_<ver>_<os>_<arch>.zip` + `scraper_meta_<os>_<arch>.json`
# 4. 组装好的分发目录（Windows 传 `dist/VideoLib/**`，解压即可运行，是整包形态）
#
# 组件包与 App 包分开，是因为它们的版本推进节奏不同：改一次刮削规则只需发
# 一个 20MB 的组件包，用户不用重下 App。
#
# 组装分别走 tools/package.ps1 / tools/package.sh，与本地发布同一路径，
# 目录结构只在那两个脚本里定义。这个结构同时是 App 侧路径解析的契约
# （见 go/internal/toolpath），所以组装后各有一道断言，结构不对就让构建失败。
#
# 组件自述里的版本是产物自己报的（`scraper version` 的第一行），不是 CI 手里的
# tag。每个 job 还会用 go/cmd/manifestgen 生成一份「只含本平台」的清单，写进
# go/internal/component/manifest_builtin.json 再编译进 App —— 断网时界面至少
# 能说出「缺哪个版本、多大」，而不是显示「未知」。release job 汇总时再生成
# 全平台的 manifest.json 挂到 Release 上。
#
# 兜底清单只在 tag 构建里生成：清单里的地址是 releases/download/<ref>，而
# Release 只对 tag 存在。手动触发（分支）时写入空清单，组件走在线清单下载 ——
# 否则包里会带一批 releases/download/main 的死地址，点下载必然 404。
#
# 尚未包含
# --------
# ffprobe 不在这里获取。缺失只影响「时长与编码」两个字段，属文档化的降级路径，
# package 脚本会给出 warning。需要随包分发时，把对应平台的 ffprobe 放到
# tools/bin/ 再由 package 脚本收进去。
#
# 触发方式：
#   * 推 tag（v*）时自动构建并发布 GitHub Release
#   * 也可以在 Actions 页面手动触发，用于冒烟验证（只传 artifact，不建 Release）
#
# 平台矩阵：
#   windows-latest     → Windows x64（Go + scraper.exe）
#   macos-latest       → macOS arm64（Go + scraper）
#   macos-15-intel     → macOS amd64（Go + scraper）
#
# 本机自测不必开三台机器：tools/build.sh 会打出当前 Mac 架构的完整
# dist/VideoLib；PyInstaller 不能交叉编译，所以另一架构/另一系统的 scraper
# 仍只能靠对应 runner 或对应机器。
#
# Release 模式与 video_cut/.github/workflows/release.yml 对齐：
# 各平台 job 先传 artifact，末尾单独 release job 汇总上传到 GitHub Release。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: 构建 Windows x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      # 版本号：推 tag 时取 tag 去掉 v；workflow_dispatch 冒烟用本地测试版本 0.1.0。
      # 同一份 VERSION 同时注入刮削器 _version.py、App 的 ldflags、wails.json
      # productVersion，避免三处显示不一致。
      - name: 解析版本号
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.1.0" >> "$GITHUB_OUTPUT"
          fi

      # Windows runner 自带的 Go 版本与 go.mod 不一定对齐；与 macOS job 一样
      # 按 go.mod 锁定，避免「本机过了、CI 挂了」的版本漂移。
      #
      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          # Tag 之间缓存隔离，发布 job 上传的缓存无法由下个 tag 复用。
          cache: false

      - name: 安装 uv
        uses: astral-sh/setup-uv@v7

      - name: 安装 Python 3.14
        run: uv python install 3.14

      - name: 同步依赖
        working-directory: python
        run: uv sync

      - name: 注入刮削器版本号
        shell: bash
        run: |
          # 只改工作区源文件，不提交；PyInstaller 打进产物的 __version__ 即来自此。
          printf '__version__ = "%s"\n' "${{ steps.ver.outputs.version }}" \
            > python/src/scraper/_version.py

      - name: 打包刮削器（PyInstaller onedir）
        working-directory: python
        run: uv run pyinstaller scraper.spec --noconfirm

      # 自检放在打包之后、组装之前：这一步能提前暴露「seleniumbase 资源没被
      # 收集进去」这类只在运行时才发作的问题，而不是等用户拿到产物才发现。
      #
      # 放在这里也是为了让环境问题尽早失败：doctor 会探测 Chrome，缺了立刻
      # 中断，不必再白跑一遍几分钟的 wails 构建。
      - name: 冻结产物自检
        working-directory: python
        # 与 go/internal/scraper/runner.go 的 Inspect 对齐：Windows runner
        # 默认 ANSI 代码页（cp1252）编不了 doctor JSON 里的中文。
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          .\dist\scraper\scraper.exe version
          .\dist\scraper\scraper.exe doctor

      # 瘦身靠 scraper.spec 里的两处过滤（见 docs/size-reduction-plan.md §2）：
      # 剔掉 selenium-manager 三份二进制与 optimize=2。前者是 PyInstaller 的
      # hook 收集进来的，升级 PyInstaller 就可能悄悄装回来 —— 那时构建全绿、
      # 代码没改，只有产物体积回涨 12MB。在这里钉死，比等用户发现包里多了东西早。
      - name: 断言瘦身生效
        shell: bash
        run: |
          stray="$(find python/dist/scraper -name 'selenium-manager*')"
          if [ -n "$stray" ]; then
            echo "产物里出现 selenium-manager（12.4MB 无用二进制），scraper.spec 的过滤失效了：" >&2
            echo "$stray" >&2
            exit 1
          fi

      # 组件包与 App 包分开上传：App 包不带刮削器时只有 10MB，刮削器改版不必重发
      # App。轻量包（默认产物）完全不含 tools\scraper，首次刮削时按需下载；
      # 这里的组件包就是那条下载路径的源。
      - name: 打包刮削器分发资产
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          New-Item -ItemType Directory -Path out -Force | Out-Null

          # 版本取自产物自述（scraper version 的 scraper 字段），不取 tag。
          # 清单里的版本与包名必须同源：两者分离时用户看到的是「装完仍提示可更新」，
          # 而构建日志一片绿 —— 那个问题只能靠装到机器上才发现。
          $metaPath = "out\scraper_meta_windows_amd64.json"
          & .\python\dist\scraper\scraper.exe version |
            Select-Object -First 1 |
            Set-Content -Path $metaPath -Encoding utf8
          $ver = (Get-Content $metaPath -Raw | ConvertFrom-Json).scraper
          if (-not $ver) { throw "无法从 $metaPath 读到刮削器版本" }
          Write-Host "scraper 版本：$ver"

          # 顶层保留 scraper\：解压侧按 component.TopLevelDir 剥壳
          # （见 TestInstallStripsTopLevelDir）。多一层或少一层，安装完都找不到可执行文件。
          #
          # Compress-Archive 在 PowerShell 7 上确实保留这一层（实测：`-Path <目录>`
          # 保留目录本身，写成 `<目录>\*` 才会平铺）。而 manifestgen 的校验是
          # 「TopLevelDir + 可执行文件」，平铺的包同样能过 —— 所以下面单独断言一次
          # 形状：这条契约只靠一行命令维持，那行被改成通配符时不该由用户来发现。
          $zipPath = "out\scraper_${ver}_windows_amd64.zip"
          Compress-Archive -Path "python\dist\scraper" -DestinationPath $zipPath -Force

          $zip = [System.IO.Compression.ZipFile]::OpenRead((Join-Path $PWD $zipPath))
          try {
            $stray = @($zip.Entries | Where-Object { -not $_.FullName.StartsWith("scraper/") })
            if ($stray.Count -gt 0) {
              throw "组件包顶层应为 scraper/，实际出现：$($stray[0].FullName)"
            }
            Write-Host "组件包结构：$($zip.Entries.Count) 个条目，全部在 scraper/ 下"
          } finally {
            $zip.Dispose()
          }

          # 立刻用 App 侧的真实解析路径校验一次（同一个 cmd/manifestgen）：
          # 包结构错了要在这台机器上失败，而不是等 release job 汇总时才暴露，
          # 那时既不知道是哪个平台打错的，也来不及分辨是打包问题还是上传问题。
          Push-Location go
          try {
            # 路径先落到变量：原生命令（go）的参数里塞括号表达式，PowerShell
            # 各版本的解析规则不一致，容易把整个 "(Resolve-Path ..\out).Path"
            # 当成字面量传进去。
            $dir = (Resolve-Path ..\out).Path
            go run ./cmd/manifestgen `
              -dir $dir `
              -base-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}" `
              -require "windows/amd64" `
              -out "$env:TEMP\manifest-check.json"
          } finally {
            Pop-Location
          }
          Get-ChildItem out

      # 把「本平台的组件清单」烘进 App：断网、或 GitHub 不可达时，
      # 界面仍能说出「缺哪个版本、多大」，而不是只能显示「未知」。
      # 用 -only 过滤到本平台：全平台清单是给 Release 用的，编进 App 白占体积。
      #
      # 只在 tag 构建里做，理由同 macOS job：分支构建没有对应的 Release，
      # 生成的 releases/download/<分支名> 地址必然 404。
      - name: 生成本平台兜底清单
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Push-Location go
          try {
            $dir = (Resolve-Path ..\out).Path
            go run ./cmd/manifestgen `
              -dir $dir `
              -base-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}" `
              -only "windows/amd64" `
              -out "internal\component\manifest_builtin.json"
          } finally {
            Pop-Location
          }
          # 生成失败会留下空文件，编译后就是「没有兜底」，而构建全绿。
          $size = (Get-Item "go\internal\component\manifest_builtin.json").Length
          if ($size -lt 100) { throw "内置清单异常（$size 字节）" }

      - name: 分支构建写入空清单
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: |
          # 显式覆盖成空清单：仓库里那份可能带着上一次本地生成的地址。
          Set-Content -Path "go\internal\component\manifest_builtin.json" `
            -Value '{"schema":1,"components":{}}' -Encoding utf8 -NoNewline
          Write-Host "非 tag 构建：不内置组件清单（在线清单仍可用）"

      - name: 安装 Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          # go install 不会把 GOPATH/bin 加进 PATH，后续步骤要用 wails，
          # 所以显式追加到 GITHUB_PATH。
          #
          # 注意：所有带反斜杠的命令都写成块标量（run: |）而不是双引号字符串 ——
          # YAML 的双引号会处理转义序列，"\g" 这类会直接解析失败。
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: 注入 App 版本号
        shell: bash
        working-directory: go
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          # wails.json productVersion → Windows 文件属性 / macOS Info.plist
          python - "$VERSION" <<'PY'
          import json
          import sys
          from pathlib import Path

          version = sys.argv[1]
          path = Path("wails.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data.setdefault("info", {})["productVersion"] = version
          path.write_text(
              json.dumps(data, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: 打包桌面 App
        working-directory: go
        # -webview2 download 是 Wails 的**默认**策略，写出来只为自解释，并不改变产物：
        # 它在运行时才发现缺 WebView2，再弹窗并联网安装
        # （internal/wv2installer/download.go 的构建约束是
        # !wv2runtime.error && !wv2runtime.browser && !wv2runtime.embed）。
        # 真正把引导程序打进产物的是 embed，代价是体积增加。
        # Win10 21H2+ 与 Win11 已自带 WebView2，所以沿用默认策略。
        #
        # -ldflags 把 tag（或冒烟测试版本）写进 videolib/internal/version.Version，
        # 前端 GetAppVersion 读的就是这个值。
        # 必须用 bash：默认 pwsh 不认行尾反斜杠续行。
        shell: bash
        run: |
          wails build -platform windows/amd64 -webview2 download -clean \
            -ldflags "-X videolib/internal/version.Version=${{ steps.ver.outputs.version }}"

      - name: 组装轻量包
        shell: pwsh
        run: |
          # 轻量包不含 tools\scraper：首次刮削时由 App 按需下载。把「不含」也
          # 断言掉 —— 哪天 package.ps1 的默认值被改回去，发出去的包会悄悄回涨 31MB，
          # 而没有任何一步会失败。
          .\tools\package.ps1
          if (Test-Path "dist\VideoLib\tools\scraper") {
            throw "轻量包里不该有 tools\scraper"
          }

          $version = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Path out -Force | Out-Null
          $pkg = Join-Path $PWD ("out\VideoLib_{0}_windows_amd64.zip" -f $version)
          # 顶层保留 VideoLib\ 目录，与 macOS tar -C dist VideoLib 对齐。
          Compress-Archive -Path "dist\VideoLib" -DestinationPath $pkg -Force
          if (-not (Test-Path $pkg)) { throw "failed to create $pkg" }
          Write-Host "轻量包：$pkg"

      - name: 组装整包（离线用）
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          # package.ps1 约定 scraper 在 tools\bin\scraper，而 PyInstaller 产出在
          # python\dist\scraper。先搬到约定位置，再交给它组装。
          Move-Item python\dist\scraper tools\bin\scraper
          .\tools\package.ps1 -Full

          # 目录结构是 App 侧路径解析的契约（go/internal/toolpath 按
          # <App>/tools/scraper/scraper.exe 定位）。结构错了，用户那边表现为
          # 「未找到刮削器组件」，而构建日志一片绿 —— 所以在这里断言。
          $required = @(
            "dist\VideoLib\VideoLib.exe",
            "dist\VideoLib\tools\scraper\scraper.exe",
            "dist\VideoLib\tools\scraper\_internal"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "整包结构缺少：$path" }
          }

          # 从最终位置真跑一次。能跑通才说明 _internal 确实与 scraper.exe 同级，
          # 而不只是「目录名字对上了」。
          .\dist\VideoLib\tools\scraper\scraper.exe version

          $version = "${{ steps.ver.outputs.version }}"
          $pkg = Join-Path $PWD ("out\VideoLib_{0}_full_windows_amd64.zip" -f $version)
          Compress-Archive -Path "dist\VideoLib" -DestinationPath $pkg -Force
          if (-not (Test-Path $pkg)) { throw "failed to create $pkg" }
          Write-Host "整包：$pkg"
          Get-ChildItem out

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: videolib-windows-x64
          # 分发目录给「从 Actions 下载后直接跑」的场景；
          # out/ 下的包与组件自述给 release job 汇总。
          path: |
            dist/VideoLib/**
            out/*
          if-no-files-found: error

  build-macos:
    name: 构建 macOS ${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # PyInstaller 不交叉编译：arm64 / x64 的 scraper 必须各自在原生
          # runner 上打。Go/Wails 虽可交叉编译，整包仍按目标架构分开构建，
          # 避免 App 与 scraper 架构不一致。
          - runner: macos-latest
            goarch: arm64
          - runner: macos-15-intel
            goarch: amd64

    steps:
      - uses: actions/checkout@v7

      - name: 解析版本号
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.1.0" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          # Tag 之间缓存隔离，发布 job 上传的缓存无法由下个 tag 复用。
          cache: false

      - name: 安装 uv
        uses: astral-sh/setup-uv@v7

      - name: 安装 Python 3.14
        run: uv python install 3.14

      - name: 同步依赖
        working-directory: python
        run: uv sync

      - name: 注入刮削器版本号
        shell: bash
        run: |
          printf '__version__ = "%s"\n' "${{ steps.ver.outputs.version }}" \
            > python/src/scraper/_version.py

      - name: 打包刮削器（PyInstaller onedir）
        working-directory: python
        run: uv run pyinstaller scraper.spec --noconfirm

      - name: 冻结产物自检
        working-directory: python
        run: |
          ./dist/scraper/scraper version
          ./dist/scraper/scraper doctor

      # 与 Windows job 同责：把关的是 scraper.spec 的两处过滤，
      # 而 macOS 是唯一可能带符号链接的平台，所以要单独断言一次。
      - name: 断言瘦身生效
        run: |
          stray="$(find python/dist/scraper -name 'selenium-manager*')"
          if [ -n "$stray" ]; then
            echo "产物里出现 selenium-manager（12.4MB 无用二进制），scraper.spec 的过滤失效了：" >&2
            echo "$stray" >&2
            exit 1
          fi

      - name: 打包刮削器分发资产
        run: |
          set -euo pipefail
          mkdir -p out
          arch="${{ matrix.goarch }}"
          meta="out/scraper_meta_macos_${arch}.json"
          # 版本取自产物自述，与 Windows job 完全同一规则。
          ./python/dist/scraper/scraper version | head -1 > "$meta"
          ver="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["scraper"])' "$meta")"
          if [ -z "$ver" ]; then
            echo "无法从 $meta 读到刮削器版本" >&2
            exit 1
          fi
          echo "scraper 版本：$ver"

          # -y 必须保留符号链接：_internal 里的 .dylib 链接一旦被解引用成副本，
          # 包会变大，而且版本更新时容易留下不一致的副本。zip 不认符号链接的
          # 前提就是这条参数。
          ( cd python/dist && zip -qry "$OLDPWD/out/scraper_${ver}_macos_${arch}.zip" scraper )

          # 用 App 侧的真实解析路径校验包结构，与 Windows job 同一入口。
          # 产物写到临时目录而不是 out/：out/ 整个会上传成本次 artifact，
          # 多一个文件就会让 release job 的资产计数断言失效。
          ( cd go && go run ./cmd/manifestgen \
              -dir "$OLDPWD/out" \
              -base-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}" \
              -require "darwin/${arch}" \
              -out "${TMPDIR:-/tmp}/manifest-check.json" )
          ls -l out

      # 与 Windows job 同责：把本平台的组件清单烘进 App，供断网时使用。
      #
      # 只在 tag 构建里做：清单里的下载地址是 releases/download/<ref>，而 release
      # job 只对 tag 跑。手动在分支上 workflow_dispatch 时照抄这条规则，会生成
      # 一批 releases/download/main 的地址 —— 那里永远没有资产，包看着能装、
      # 点下去必然 404。分支构建保持仓库里那份空清单，走在线清单这条路。
      - name: 生成本平台兜底清单
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          arch="${{ matrix.goarch }}"
          ( cd go && go run ./cmd/manifestgen \
              -dir "$OLDPWD/out" \
              -base-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}" \
              -only "darwin/${arch}" \
              -out internal/component/manifest_builtin.json )
          size="$(wc -c < go/internal/component/manifest_builtin.json)"
          if [[ "$size" -lt 100 ]]; then
            echo "内置清单异常（$size 字节）" >&2
            exit 1
          fi

      - name: 分支构建写入空清单
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          # 显式写成空清单而不是「什么都不做」：仓库里那份可能是上一次本地
          # 生成后忘了还原的，带着旧地址一起被打进包里就会 404。
          printf '{"schema":1,"components":{}}\n' \
            > go/internal/component/manifest_builtin.json
          echo "非 tag 构建：不内置组件清单（在线清单仍可用）"

      - name: 安装 Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: 注入 App 版本号
        shell: bash
        working-directory: go
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          python3 - "$VERSION" <<'PY'
          import json
          import sys
          from pathlib import Path

          version = sys.argv[1]
          path = Path("wails.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data.setdefault("info", {})["productVersion"] = version
          path.write_text(
              json.dumps(data, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: 打包桌面 App
        working-directory: go
        run: |
          wails build -platform "darwin/${{ matrix.goarch }}" -clean \
            -ldflags "-X videolib/internal/version.Version=${{ steps.ver.outputs.version }}"

      - name: 组装轻量包
        run: |
          set -euo pipefail
          ./tools/package.sh
          if [[ -e "dist/VideoLib/tools/scraper" ]]; then
            echo "轻量包里不该有 tools/scraper" >&2
            exit 1
          fi
          version="${{ steps.ver.outputs.version }}"
          pkg="out/VideoLib_${version}_macos_${{ matrix.goarch }}.tar.gz"
          # .app 内大量可执行位与符号链接，zip 上传后容易丢权限；
          # 用 tar.gz 保留模式位，用户解开即可用。
          tar -czf "$pkg" -C dist VideoLib
          ls -lh "$pkg"

      - name: 组装整包（离线用）
        run: |
          set -euo pipefail
          rm -rf tools/bin/scraper
          mkdir -p tools/bin
          mv python/dist/scraper tools/bin/scraper
          ./tools/package.sh --full

          # 与 Windows 侧同一契约：结构错了用户表现为「未找到刮削器组件」。
          # toolpath 从 VideoLib.app/Contents/MacOS/ 向上找 tools/scraper/scraper。
          required=(
            "dist/VideoLib/VideoLib.app"
            "dist/VideoLib/VideoLib.app/Contents/MacOS/VideoLib"
            "dist/VideoLib/tools/scraper/scraper"
            "dist/VideoLib/tools/scraper/_internal"
          )
          for path in "${required[@]}"; do
            if [[ ! -e "$path" ]]; then
              echo "整包结构缺少：$path" >&2
              exit 1
            fi
          done

          # 从最终位置真跑一次，确认 _internal 与 scraper 同级且可执行。
          "./dist/VideoLib/tools/scraper/scraper" version

          version="${{ steps.ver.outputs.version }}"
          pkg="out/VideoLib_${version}_full_macos_${{ matrix.goarch }}.tar.gz"
          tar -czf "$pkg" -C dist VideoLib
          ls -lh "$pkg"

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: videolib-macos-${{ matrix.goarch }}
          path: out/*
          if-no-files-found: error

  # 与 video_cut 的 release job 同责：三个平台包齐了再发 Release。
  # workflow_dispatch 冒烟只构建、不发布，避免测试 run 污染 Releases 页。
  #
  # 汇总的资产分两类用途：
  #   轻量包（默认下载）+ 整包（离线）+ 组件包 + manifest.json
  # 轻量包不含刮削器，App 首次刮削时按 manifest 下载；整包给拿不到 GitHub 直连、
  # 或要拷到无网机器的人。两条路都留在 Release 上 —— 只留按需下载的话，网络
  # 受限的用户就没有任何可用形态了。
  release:
    name: 发布 GitHub Release
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      # 生成清单要走 go/cmd/manifestgen，需要源码与 Go 工具链。
      - uses: actions/checkout@v7

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache: false

      - name: 下载全部构建产物
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: 收集 Release 资产
        run: |
          set -euo pipefail
          # 各 job 的 artifact 根结构不完全一致（Windows 还带未打包的分发目录），
          # 按文件名找包，不假设固定层级。
          # 用「临时数组 + while read」而不是 mapfile：CI 的 Ubuntu runner 上
          # mapfile 可用，但它把这段脚本锁死在 bash 4+，本地（macOS 自带 3.2）
          # 就没法原样跑一遍。发布脚本恰恰是最需要本地预演的东西。
          collect() {
            local -a out=()
            while IFS= read -r file; do out+=("$file"); done < <(find release-assets -type f "$@" | sort)
            printf '%s\n' "${out[@]}"
          }

          # 轻量与整包分开匹配：两者文件名只差一个 _full_，用同一个模式会把
          # 整包算进轻量包 —— 数量对得上，而「默认下载项」可能是 40MB 的整包。
          lite=()
          while IFS= read -r file; do lite+=("$file"); done < <(collect \
            \( -name 'VideoLib_*_windows_amd64.zip' -o \
               -name 'VideoLib_*_macos_arm64.tar.gz' -o \
               -name 'VideoLib_*_macos_amd64.tar.gz' \) ! -name '*_full_*')
          full=()
          while IFS= read -r file; do full+=("$file"); done < <(collect \
            \( -name 'VideoLib_*_full_windows_amd64.zip' -o \
               -name 'VideoLib_*_full_macos_arm64.tar.gz' -o \
               -name 'VideoLib_*_full_macos_amd64.tar.gz' \))
          # 组件包与它的自述文件。自述由构建阶段写入（scraper version 的原样输出），
          # 清单里的版本与协议因此来自产物本身，不来自 CI 手里的变量。
          components=()
          while IFS= read -r file; do components+=("$file"); done < <(collect -name 'scraper_*_*.zip')
          metas=()
          while IFS= read -r file; do metas+=("$file"); done < <(collect -name 'scraper_meta_*.json')

          failed=0
          check() {
            if [[ "$2" -ne "$3" ]]; then
              echo "$1 应有 $3 个，实际 $2 个" >&2
              failed=1
            fi
          }
          check "轻量包" "${#lite[@]}" 3
          check "整包" "${#full[@]}" 3
          check "组件包" "${#components[@]}" 3
          check "组件自述" "${#metas[@]}" 3
          if [[ "$failed" -ne 0 ]]; then
            find release-assets -type f >&2
            exit 1
          fi

          mkdir -p release-pkg
          cp "${lite[@]}" "${full[@]}" "${components[@]}" "${metas[@]}" release-pkg/

      - name: 生成组件清单
        run: |
          set -euo pipefail
          # 清单同时被这里校验：生成器会用 App 的解析路径与 Spec 校验把结果读一遍，
          # 读不懂就失败 —— 清单挂在 Release 上之后才发现格式问题，代价是用户那边
          # 「刮削器装不上」而日志里只有一个看不懂的解析错误。
          ( cd go && go run ./cmd/manifestgen \
              -dir ../release-pkg \
              -base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" \
              -require "windows/amd64,darwin/arm64,darwin/amd64" \
              -out ../release-pkg/manifest.json )

          # 自述文件只是这一段的输入，不发布：清单里已有同样的信息，多三个 json
          # 只会让下载列表更难挑。它们仍留在 artifact 里，需要时能从 Actions 取。
          rm -f release-pkg/scraper_meta_*.json
          ls -l release-pkg

      - name: 生成校验和
        run: |
          set -euo pipefail
          (
            cd release-pkg
            # manifest.json 也纳入校验和：用户手动下载后可以先核对清单，再核对包。
            # SHA256SUMS.txt 自身不纳入。
            #
            # 用 ls + grep 而不是 find -printf：后者是 GNU 扩展，换 macOS runner
            # 或本地复跑就会报 unknown predicate —— 而这一步出错的后果是「校验和
            # 少了几个文件」，不会失败，只是悄悄少一行。
            LC_ALL=C ls -1 | grep -vx 'SHA256SUMS.txt' | sort | xargs sha256sum > SHA256SUMS.txt
            echo "SHA256SUMS:"
            cat SHA256SUMS.txt
          )

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-pkg/*)
          # 3 个轻量包 + 3 个整包 + 3 个组件包 + manifest.json + SHA256SUMS.txt。
          # 数量写死是有意的：将来加 ffprobe 组件时这里会失败，逼着人回来确认
          # 新资产确实该发，而不是无声地多发一个包。
          expected=11
          if [[ "${#assets[@]}" -ne "$expected" ]]; then
            echo "expected $expected assets, got ${#assets[@]}:" >&2
            printf '  %s\n' "${assets[@]}" >&2
            exit 1
          fi
          for asset in "${assets[@]}"; do
            basename "$asset"
          done

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "VideoLib $GITHUB_REF_NAME" \
              --generate-notes
          fi
