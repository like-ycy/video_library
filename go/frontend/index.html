<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>视频库</title>
  <script>
    // 尽早标记平台：macOS 用系统红绿灯，Windows/Linux 显示自绘窗口按钮。
    // 包在 head、stylesheet 之前，避免 Mac 上闪出 Windows 按钮。
    (function () {
      var ua = navigator.userAgent;
      var p = ua.indexOf('Mac') >= 0 ? 'darwin'
        : ua.indexOf('Win') >= 0 ? 'windows' : 'linux';
      document.documentElement.dataset.platform = p;
    })();
    // 尽早解析主题偏好，避免模块加载前闪一次默认深色。
    // system 先用 matchMedia 猜；启动后由原生 GetSystemAppearance 纠正。
    (function () {
      try {
        var pref = localStorage.getItem('cinevault.theme') || 'system';
        if (pref !== 'dark' && pref !== 'light' && pref !== 'system') pref = 'system';
        var resolved = pref;
        if (pref === 'system' && window.matchMedia) {
          resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = resolved;
        document.documentElement.dataset.themePref = pref;
        document.documentElement.style.colorScheme = resolved;
      } catch (e) { /* ignore */ }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./src/main.tsx"></script>
</body>
</html>
